# CI: push/PR 때 전체 게이트 실행 (빌드 + Spotless 포맷 검사 + Checkstyle + 테스트)
# 테스트는 H2 인메모리라 DB·Docker 불필요. 서버 배포(CD)는 배포 대상이 생기면 별도 워크플로로 추가.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# 저장소 읽기만 하면 되므로 토큰 권한 최소화
permissions:
  contents: read

# PR은 새 push 오면 이전 실행 취소(분 절약), develop·main은 취소 안 함(통과 기록 보존)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        id: build
        run: ./gradlew build

      # 실패 시 spotless·checkstyle·test 리포트 업로드
      - name: Upload reports
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports
