# 운영 VM 켜기·끄기·상태. 어디서든 같은 경로:
#   gh workflow run vm-power.yml -R RUNVEAL/Backend -f action=start|stop|status
#   또는 GitHub 앱 → Actions → VM power → Run workflow
# 크레딧 절약: 매일 02:07 KST 끄고 09:07 KST 켠다 (schedule 은 default 브랜치 develop 기준, 정각은 GitHub 이 자주 늦춘다).
# stop = deallocate (요금이 멈춘다). 디스크·IP 요금만 남는다.
# Azure 권한: 전원 아이덴티티(runveal-gha-power) = VM 켜기·끄기·조회만. 배포 권한 없음.
name: VM power

on:
  workflow_dispatch:
    inputs:
      action:
        description: start · stop · status
        type: choice
        options: [status, start, stop]
        default: status
  schedule:
    - cron: '7 17 * * *' # 02:07 KST stop
    - cron: '7 0 * * *' # 09:07 KST start

permissions:
  contents: read
  id-token: write

# stop 만 배포와 같은 그룹에서 줄을 선다 (배포 도중에 꺼지지 않게).
# start · status 는 각자 따로 돈다 → 대기 중인 배포를 밀어내지 않는다 (GitHub 는 그룹당 대기 1개만 남긴다)
concurrency:
  group: ${{ (inputs.action == 'stop' || github.event.schedule == '7 17 * * *') && 'production' || format('vm-power-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RG: runveal-rg
      VM: runveal-api
      HOST: ${{ vars.VM_HOST }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_ACTION: ${{ inputs.action }}
    steps:
      - name: 할 일
        id: what
        run: |
          case "$SCHEDULE" in
            '7 17 * * *') a=stop ;;
            '7 0 * * *') a=start ;;
            *) a=$INPUT_ACTION ;;
          esac
          case "$a" in start|stop|status) ;; *) echo "알 수 없는 action: $a"; exit 1 ;; esac
          echo "action=$a" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_POWER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ${{ steps.what.outputs.action }}
        env:
          ACTION: ${{ steps.what.outputs.action }}
        run: |
          power() {
            az vm get-instance-view -g "$RG" -n "$VM" \
              --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv
          }
          # --no-wait + 직접 확인: 전원 아이덴티티에는 구독 단위 작업 조회 권한이 없다
          case "$ACTION" in
            start) want=PowerState/running; az vm start -g "$RG" -n "$VM" --no-wait ;;
            stop) want=PowerState/deallocated; az vm deallocate -g "$RG" -n "$VM" --no-wait ;;
            status) want= ;;
          esac
          state=$(power)
          if [ -n "$want" ]; then
            for _ in $(seq 60); do state=$(power); [ "$state" = "$want" ] && break; sleep 5; done
          fi
          echo "### VM \`$VM\`: ${state#PowerState/}" >> "$GITHUB_STEP_SUMMARY"
          [ -z "$want" ] || [ "$state" = "$want" ] || { echo "::error::$want 이 안 됨 (지금 $state)"; exit 1; }
          [ "$state" = PowerState/running ] || exit 0
          # 켜져 있으면 API 가 실제로 응답하는지까지 (부팅 직후 그래프 로딩 대기)
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/api/v1/meta" || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          echo "- API \`/api/v1/meta\`: $code → https://$HOST" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ]
